  description: A job created by POST /v1/identify; matches diarized speakers to supplied voiceprints.
- name: Voiceprint
  domain: voiceprints
  schemas:
  - Voiceprint
  description: A {label, voiceprint} pair supplied in IdentifyRequest.voiceprints. Voiceprints are not
    stored server-side as addressable resources; the caller keeps them.
