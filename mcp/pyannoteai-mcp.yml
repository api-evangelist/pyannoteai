  vendor_platform: Mintlify
  instructions: >-
    "This Model Context Protocol server provides search and retrieval tools for the pyannoteAI site. Use
    it to answer questions from public site content. ... Apart from the submit_feedback tool, the server
    is read-only and scoped to pyannoteAI; it does not otherwise perform actions, mutate state, or
    access anything beyond the published site content and these resources."
scope:
  kind: documentation
  note: >-
    IMPORTANT — this is a DOCUMENTATION-retrieval MCP server, not an API-operation server. Its three
    tools search and read the published docs; none of them call the pyannoteAI REST API. An agent can
    use it to learn how to diarize audio, but cannot use it to actually submit a diarization job. The
    ten REST operations in openapi/ have no MCP tool. See mcp/pyannoteai-tool-crosswalk.yml.
capabilities:
  tools:
    listChanged: true
  resources:
    listChanged: true
tools:
- name: search_pyannote_ai
  title: Search documentation
  description: >-
    Search across the pyannoteAI knowledge base to find relevant information, code examples, API
    references, and guides.
  input_schema:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        description: Search query
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
- name: query_docs_filesystem_pyannote_ai
  description: >-
    Run a read-only shell-like query (rg, grep, find, tree, ls, cat, head, tail, jq, ...) against a
    virtualized in-memory filesystem containing only the pyannoteAI documentation pages and OpenAPI
    specs. Stateless per call; no writes, no network.
  input_schema:
    type: object
    required:
    - command
  annotations:
    readOnlyHint: true
- name: submit_feedback
  title: Submit documentation feedback
  description: Report an incorrect, outdated, confusing or incomplete documentation page to the docs team.
  input_schema:
    type: object
    required:
    - path
    - feedback
  annotations:
    readOnlyHint: false
  note: The only non-read-only tool on the server; it writes documentation feedback, not API state.
resources:
- uri: mintlify://skills/pyannote
  name: pyannote
  mime_type: text/markdown
  description: >-
    Use when building speaker diarization and identification features into voice applications, meeting
