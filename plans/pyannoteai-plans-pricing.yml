billing_rules:
- rule: minimum charge
  detail: >-
    20-second minimum for every successful /diarize, /identify and /live job. An 8-second job bills as
    20 seconds; a 182-second job bills as 182 seconds.
  source: https://docs.pyannote.ai/administration/billing
- rule: failed jobs are free
  detail: Rejected submissions, failed jobs and canceled jobs are not billed.
- rule: transcription pricing
  detail: >-
    Enabling transcription on /diarize bills the job at the STT Orchestration rate; diarization segments
    are still returned at no additional cost.
- rule: budget cap
  detail: >-
    A monthly budget with email alert thresholds can be set on the billing page; exceeding it causes
    subsequent API requests to be rejected, with a possible enforcement delay.
notes: >-
