apis:
- aid: pyannoteai-api
  name: pyannoteAI API
  description: 'REST API for speaker diarization, speaker identification with voiceprints, and
    speech-to-text orchestration over audio files, plus a streaming WebSocket gateway for real-time
    diarization. Jobs are asynchronous: submit to /v1/diarize, /v1/identify or /v1/voiceprint, then poll
    /v1/jobs/{jobId} or receive an HMAC-signed webhook. Temporary media storage is provided via
    pre-signed upload URLs under the media:// scheme.'
