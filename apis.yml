aid: pyannoteai
name: PyannoteAI
description: 'pyannoteAI builds speaker intelligence infrastructure for voice AI: a hosted REST and
  WebSocket API that answers "who spoke when" (speaker diarization) and "who is speaking" (speaker
  identification via voiceprints) for both batch audio files and live streams. The company commercializes
  the widely adopted open-source pyannote.audio library, offering batch diarization, real-time streaming
  diarization over a WebSocket gateway, voiceprint enrollment and matching, and speech-to-text
  orchestration that returns speaker-attributed transcripts in a single call. Developers authenticate
  with a bearer API key, submit asynchronous jobs, and receive results by polling or signed webhooks.'
